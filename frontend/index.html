<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4f2d25" />
    <title>Coffee POS - Quản Lý Quán Cà Phê</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coffee: {
                50: '#fdf8f6',
                100: '#f2e8e5',
                200: '#eaddd7',
                300: '#e0c2b7',
                400: '#d0a293',
                500: '#a36d5c',
                600: '#8c5344',
                700: '#734135',
                800: '#5f352b',
                900: '#4f2d25',
                950: '#2d1813',
              }
            }
          }
        }
      }
    </script>
    <!-- Google Font Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        -webkit-tap-highlight-color: transparent !important;
        touch-action: manipulation;
      }
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Tối ưu cuộn mượt cho Android */
      .overflow-y-auto, .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Chống Android Chrome tự động Zoom gây giật lag khi gõ input */
      @media (max-width: 768px) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }
      /* Custom Scrollbar nhẹ hơn cho mobile */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d0a293;
        border-radius: 99px;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-800 antialiased selection:bg-coffee-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
